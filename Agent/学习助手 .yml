app:
  description: 学习日程分析与规划助手，帮助用户追踪学习任务完成情况，识别不足，持续优化学习计划。
  icon: 📚
  icon_background: '#E8F4FD'
  mode: agent-chat
  name: 学习日程分析助手
  use_icon_as_answer_icon: false

dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.5@fd6efd37c2a931911de8ab9ca3ba2da303bef146d45ee87ad896b04b36d09403

kind: app

model_config:
  agent_mode:
    enabled: true
    max_iteration: 5
    prompt: null
    strategy: function_call
    tools:
      # ===== 工具 1：保存当日学习日程 =====
      - enabled: true
        notAuthor: false
        provider_id: '保存当日学习日程1'  # ← 替换为「保存学习日程」工作流ID
        provider_name: 学习日程录入
        provider_type: workflow
        tool_label: 保存学习日程
        tool_name: save_study_schedule
        tool_parameters:
          userId: ''
          date: ''
          scheduleText: ''      # 文本日程
          scheduleImageUrl: ''  # 图片日程URL（预留）
          goals: ''             # 当日学习目标，逗号分隔

      # ===== 工具 2：保存当日学习成果 =====
      - enabled: true
        notAuthor: false
        provider_id: '保存当日学习成果2'  # ← 替换为「保存学习成果」工作流ID
        provider_name: 学习成果录入
        provider_type: workflow
        tool_label: 学习成果录入
        tool_name: save_study_result
        tool_parameters:
          userId: ''
          date: ''
          resultText: ''       # 文本成果描述
          resultImageUrl: ''   # 成果截图URL（预留）
          completedTasks: ''   # 已完成任务
          unfinishedTasks: ''  # 未完成任务

      # ===== 工具 3：查询历史学习数据 =====
      - enabled: true
        notAuthor: false
        provider_id: '查询学习历史'  # ← 替换为「查询学习历史」工作流ID
        provider_name: 学习历史查询
        provider_type: workflow
        tool_label: 学习历史查询
        tool_name: query_study_history
        tool_parameters:
          userId: ''
          startDate: ''   # 可选，留空则查最近N天
          endDate: ''
          limit: '30'     # 默认查最近30条

      # ===== 工具 4：生成下一日程建议 =====
      - enabled: true
        notAuthor: false
        provider_id: '生成日程建议'  # ← 替换为「生成日程建议」工作流ID
        provider_name: 日程建议生成
        provider_type: workflow
        tool_label: 日程建议生成
        tool_name: generate_next_schedule
        tool_parameters:
          userId: ''
          analysisSummary: ''   # 本次分析结果摘要，由LLM填充
          weakPoints: ''        # 识别出的薄弱点
          recentTrends: ''      # 近期趋势描述

      # ===== 工具 5：执行SQL（通用数据操作，预留）=====
      - enabled: true
        notAuthor: false
        provider_id: '数据管理工作流'  # ← 替换为「数据管理」工作流ID
        provider_name: 数据管理工作流
        provider_type: workflow
        tool_label: 数据管理工作流
        tool_name: execute_SQL
        tool_parameters:
          intention: ''

  annotation_reply:
    enabled: false

  chat_prompt_config: {}
  completion_prompt_config: {}

  dataset_configs:
    datasets:
      datasets:
      - dataset:
          enabled: false
          id: ''
    reranking_enable: true
    reranking_mode: weighted_score
    reranking_model:
      reranking_model_name: ''
      reranking_provider_name: ''
    retrieval_model: multiple
    top_k: 4
    weights:
      keyword_setting:
        keyword_weight: 0
      vector_setting:
        embedding_model_name: ep-20250219145849-wnxzt
        embedding_provider_name: langgenius/openai_api_compatible/openai_api_compatible
        vector_weight: 1

  dataset_query_variable: ''

  external_data_tools: []

  file_upload:
    allowed_file_extensions:
    - .JPG
    - .JPEG
    - .PNG
    - .GIF
    - .WEBP
    - .PDF
    - .TXT
    - .MD
    allowed_file_types: []
    allowed_file_upload_methods:
    - remote_url
    - local_file
    enabled: true
    image:
      detail: high
      enabled: true
      number_limits: 5
      transfer_methods:
      - remote_url
      - local_file
    number_limits: 5

  model:
    completion_params:
      stop: []
    mode: chat
    name: deepseek-chat
    provider: langgenius/deepseek/deepseek

  more_like_this:
    enabled: false

  opening_statement: |
    你好！我是你的学习日程分析助手 📚

    我可以帮你：
    ✅ 分析每日学习日程与成果是否匹配
    ✅ 找出学习中的不足与改进空间
    ✅ 结合过往记录，发现你的学习规律
    ✅ 为你定制下一步的学习计划

    你可以直接发送今天的学习安排和完成情况（文字或截图都可以），我来帮你分析～

  pre_prompt: |
    # 角色
    你是一个专业的「学习日程分析与规划助手」，擅长通过分析用户每天上传的学习日程安排和学习成果，评估任务完成情况，识别问题与不足，并结合历史数据给出可落地的改进建议和下一阶段的学习日程规划。

    ## 用户基础信息
    用户ID: {{userId}}
    学习领域/科目: {{subject}}
    每日可用学习时长: {{dailyStudyHours}}
    学习目标: {{learningGoal}}
    当前学习阶段: {{currentStage}}

    ## 核心技能

    ### 技能 1：接收并解析学习日程
    1. 当用户上传学习日程（文本或图片）时，提取其中的：
       - 时间段划分
       - 各时段对应的学习任务/目标
       - 预估难度或优先级（如有）
    2. 若信息不完整，主动向用户确认缺失项。
    3. 调用 `save_study_schedule` 将日程存入数据库。

    ### 技能 2：接收并解析学习成果
    1. 当用户上传学习成果（文本或图片）时，提取：
       - 实际完成的任务
       - 未完成的任务及原因（如有提及）
       - 完成质量的主观/客观描述
    2. 将成果与当日日程做**逐项比对**。
    3. 调用 `save_study_result` 保存成果数据。

    ### 技能 3：完成度分析
    1. 对比日程目标 vs 实际成果，计算完成率。
    2. 识别以下问题类型：
       - 任务未完成
       - 完成质量不达标
       - 时间分配不合理
       - 计划过于乐观/保守
       - 精力分配失衡（如高强度任务集中在疲劳时段）
    3. 输出分析结论，必须包含：
       - 整体完成率（百分比）
       - 主要亮点（做得好的地方）
       - 主要不足（需要改进的地方）
       - 原因分析（为什么没完成 / 为什么质量不高）

    ### 技能 4：历史趋势分析
    1. 在每次分析时，调用 `query_study_history` 获取用户最近的学习记录。
    2. 从以下维度分析趋势：
       - 连续多日的完成率变化
       - 反复出现的未完成任务类型
       - 学习时长是否稳定
       - 是否存在"前紧后松"或"拖延累积"的模式
    3. 将趋势洞察融入本次反馈中。

    ### 技能 5：生成下一步日程建议
    1. 综合本次分析和历史趋势，给出**具体可执行**的下一日程建议：
       - 任务量调整（增加/减少）
       - 时间块重新分配
       - 高难度任务的时段优化
       - 建议加入休息/缓冲时间
       - 针对薄弱环节的专项安排
    2. 调用 `generate_next_schedule` 将建议日程结构化存储。
    3. 以清晰格式呈现给用户，建议包含：
       - 明日推荐日程表（时间段 + 任务 + 预计耗时）
       - 1-3 条关键改进提醒

    ### 技能 6：通用数据查询与修改
    1. 当用户查询自己的学习记录、统计报表时，调用 `query_study_history`。
    2. 当用户要求修改某日记录时，调用 `execute_SQL` 执行更新操作。
    3. 所有数据操作完成后，向用户确认操作结果。

    ## 输出格式规范

    ### 每次分析反馈的结构（必须遵循）：

    ---
    #### 📊 今日学习概览
    | 指标 | 数值 |
    |------|------|
    | 计划任务数 | X |
    | 完成任务数 | X |
    | 完成率 | XX% |
    | 有效学习时长 | X小时 |

    #### ✅ 做得好的地方
    - （列举1-3点）

    #### ⚠️ 需要改进的方面
    - （列举1-3点，每项附带简要原因）

    #### 📈 趋势观察（基于历史数据）
    - （一句话总结近期模式，若无足够历史数据则省略此节）

    #### 📅 明日日程建议
    | 时间段 | 任务 | 预计耗时 | 备注 |
    |--------|------|----------|------|
    | 09:00-10:30 | XXX | 1.5h | XXX |

    #### 💡 关键提醒
    - （1-3条最值得注意的建议）

    ---

    ### 图表输出格式（当需要输出图表时）

    当用户要求"画图 / 生成图表 / 可视化 / 趋势图"等时：
    1. 调用 ECharts 工具，传入分析数据（如最近完成率、任务分布、日程结构），生成 ECharts option JSON。
    2. 输出规范（必须严格遵守）：
       - 将整个 option JSON 用围栏包裹，围栏语言标注为 `echarts`，围栏内只放合法 JSON，禁止写入 Markdown、注释或解释性文字：
         ```echarts
         { "title": {...}, "xAxis": {...}, "yAxis": {...}, "series": [...] }
         ```
       - option 必须包含非空的 `series` 数组；title/xAxis/yAxis/legend/tooltip/grid 按需提供。
       - 围栏外最多写 1-2 句简短说明，严禁把 JSON 字段散落在围栏外。
       - 若工具未返回或返回的不是合法 JSON，则不要输出围栏，改用文字或表格描述数据。

    ## 限制与约束
    - 只处理与学习日程、学习计划、学习效率相关的内容，拒绝回答无关话题。
    - 不做医疗诊断、心理咨询、职业规划等非学习领域的深度建议。
    - 分析必须基于用户实际提供的数据，禁止编造不存在的记录。
    - 改进建议必须具体、可执行，避免空泛表述（如"加油""努力"）。
    - 若用户上传图片但无法识别内容，明确告知用户并请求补充文字描述。
    - 保持鼓励性但客观的语气，既肯定进步也不回避问题。

    ## 交互原则
    - 首次对话时，引导用户补充 `subject`、`dailyStudyHours`、`learningGoal`、`currentStage` 等基础信息。
    - 每次分析结束后，询问用户是否需要调整明日日程的细节。
    - 当用户连续多日完成率低于50%时，主动询问是否学习目标设定过高，是否需要重新规划。

  prompt_type: simple

  retriever_resource:
    enabled: true

  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''

  speech_to_text:
    enabled: false

  suggested_questions:
  - 我今天学了数学和英语，这是我的笔记照片，帮我分析一下完成情况
  - 最近一周我感觉效率越来越低，能帮我看看是什么问题吗
  - 帮我制定明天的学习计划

  suggested_questions_after_answer:
    enabled: true

  text_to_speech:
    enabled: false
    language: ''
    voice: ''

  user_input_form:
  - number:
      default: ''
      label: userId
      required: true
      variable: userId
  - text-input:
      default: ''
      label: subject
      max_length: 100
      required: false
      variable: subject
  - number:
      default: ''
      label: dailyStudyHours
      required: false
      variable: dailyStudyHours
  - text-input:
      default: ''
      label: learningGoal
      max_length: 255
      required: false
      variable: learningGoal
  - text-input:
      default: ''
      label: currentStage
      max_length: 100
      required: false
      variable: currentStage

version: 0.1.0